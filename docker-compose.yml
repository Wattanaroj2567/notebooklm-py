services:
  mcp-auth-sync:
    build:
      context: .
      network: host
    container_name: notebooklm-mcp-auth-sync
    restart: "no"
    environment:
      - NOTEBOOKLM_PROFILE=${NOTEBOOKLM_PROFILE:-default}
    volumes:
      # Read the user's freshly logged-in host profile.
      - ~/.notebooklm:/host-notebooklm:ro
      # Write the stable workspace-local mirror consumed by notebooklm-mcp.
      - ./.notebooklm-docker:/target-notebooklm
    command:
      - sh
      - -lc
      - |
        set -eu

        TARGET_PROFILE_DIR="/target-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}"
        TARGET_STORAGE="$$TARGET_PROFILE_DIR/storage_state.json"

        # Smart Init: If Docker already has a healthy session, skip syncing from host.
        if [ -f "$$TARGET_STORAGE" ]; then
          if NOTEBOOKLM_HOME=/target-notebooklm notebooklm auth check --test --json >/dev/null 2>&1; then
            echo "✅ Existing Docker auth is healthy. Skipping sync from host to preserve session."
            exit 0
          fi
          echo "⚠️  Existing Docker auth is unhealthy or expired. Proceeding with sync from host..."
        fi

        rm -rf "/target-notebooklm/.sync-tmp"

        if [ ! -f "/host-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/storage_state.json" ]; then
          echo "Missing host auth file: /host-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/storage_state.json" >&2
          echo "Run: notebooklm login --fresh" >&2
          exit 1
        fi

        mkdir -p "/target-notebooklm/.sync-tmp/profiles/${NOTEBOOKLM_PROFILE:-default}"
        cp "/host-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/storage_state.json" \
          "/target-notebooklm/.sync-tmp/profiles/${NOTEBOOKLM_PROFILE:-default}/storage_state.json"
        chmod 600 "/target-notebooklm/.sync-tmp/profiles/${NOTEBOOKLM_PROFILE:-default}/storage_state.json"

        if [ -f /host-notebooklm/config.json ]; then
          cp /host-notebooklm/config.json /target-notebooklm/.sync-tmp/config.json
          chmod 600 /target-notebooklm/.sync-tmp/config.json
        fi

        if [ -f "/host-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/context.json" ]; then
          cp "/host-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/context.json" \
            "/target-notebooklm/.sync-tmp/profiles/${NOTEBOOKLM_PROFILE:-default}/context.json"
          chmod 600 "/target-notebooklm/.sync-tmp/profiles/${NOTEBOOKLM_PROFILE:-default}/context.json"
        fi

        if ! NOTEBOOKLM_HOME=/target-notebooklm/.sync-tmp notebooklm auth check --test --json >/dev/null 2>&1; then
          echo "⚠️  Synced host auth is also unhealthy. Proceeding anyway to allow Docker-side rescue."
        fi

        mkdir -p "/target-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}"
        cp "/target-notebooklm/.sync-tmp/profiles/${NOTEBOOKLM_PROFILE:-default}/storage_state.json" \
          "/target-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/storage_state.json"
        chmod 600 "/target-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/storage_state.json"

        if [ -f /target-notebooklm/.sync-tmp/config.json ]; then
          cp /target-notebooklm/.sync-tmp/config.json /target-notebooklm/config.json
          chmod 600 /target-notebooklm/config.json
        fi

        if [ -f "/target-notebooklm/.sync-tmp/profiles/${NOTEBOOKLM_PROFILE:-default}/context.json" ]; then
          cp "/target-notebooklm/.sync-tmp/profiles/${NOTEBOOKLM_PROFILE:-default}/context.json" \
            "/target-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/context.json"
          chmod 600 "/target-notebooklm/profiles/${NOTEBOOKLM_PROFILE:-default}/context.json"
        fi

        rm -rf "/target-notebooklm/.sync-tmp"
        echo "MCP auth mirror synced and verified."

  notebooklm-mcp:
    build:
      context: .
      network: host
    container_name: notebooklm-mcp
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NOTEBOOKLM_HOME=/root/.notebooklm
      - NOTEBOOKLM_PROFILE=${NOTEBOOKLM_PROFILE:-default}
      # Optional: NotebookLM notebook containing AI-team manuals and MCP workflow docs.
      # Agents query this through ask_framework_manual instead of local framework files.
      - NOTEBOOKLM_FRAMEWORK_NOTEBOOK_ID=${NOTEBOOKLM_FRAMEWORK_NOTEBOOK_ID:-}
      # Directory add_file is allowed to read (server-side only). Drop files
      # to import into ./mcp_imports on the host.
      - NOTEBOOKLM_MCP_FILE_ROOT=/imports
    volumes:
      # Use a workspace-local auth mirror to avoid stale home-directory mounts
      # in Docker Desktop / sandboxed environments. Refresh it with:
      #   scripts/sync_mcp_auth.sh
      - ./.notebooklm-docker:/root/.notebooklm
      # Map MCP skill hints for deterministic tool-use rules.
      - ./MCP_SKILL.md:/app/MCP_SKILL.md:ro
      # Host folder for add_file imports (create ./mcp_imports as needed).
      - ./mcp_imports:/imports
    ports:
      - "8000:8000"
    depends_on:
      mcp-auth-sync:
        condition: service_completed_successfully

  # Dedicated tunnel for notebooklm-mcp.tawanlab.site
  # This separates it from the 'notebooklm-backend' tunnel.
  mcp-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mcp-tunnel
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Use --url to explicitly route traffic to the mcp service within the docker network
    command: tunnel --no-autoupdate run --url http://notebooklm-mcp:8000
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_TRANSPORT_PROTOCOL=http2
      - TUNNEL_EDGE_IP_VERSION=auto
    depends_on:
      - notebooklm-mcp
