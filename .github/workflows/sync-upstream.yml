name: Sync Upstream

on:
  schedule:
    - cron: "0 2 * * *"  # daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward main from upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/teng-lin/notebooklm-py.git

      - name: Fetch upstream main
        run: git fetch upstream main

      - name: Fast-forward main
        run: |
          git merge upstream/main --ff-only || {
            echo "::error::Fast-forward failed — upstream has diverged. Manual merge required."
            exit 1
          }

      - name: Push to origin
        run: git push origin main
